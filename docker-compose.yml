services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: meditrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    networks:
      - meditrack-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Storage
  redis:
    image: redis:7-alpine
    container_name: meditrack-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - meditrack-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MediTrack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: meditrack-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      APP_URL: ${APP_URL}
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./uploads:/app/uploads
    ports:
      - '3000:3000'
    networks:
      - meditrack-network

volumes:
  postgresdata:
  redisdata:

networks:
  meditrack-network:
    driver: bridge
